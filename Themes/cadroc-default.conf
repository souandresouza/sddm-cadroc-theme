[General]
#################### General ####################
# Valores vazios = automático. O Cadroc gera este arquivo a partir da paleta
# do tema (ACCENT_COLOR/FONT_FAMILY) e aplica com: ./installer.sh --recolor

ScreenWidth=""
ScreenHeight=""
# Vazio usa o tamanho real da tela (responsivo). Fixe só se precisar.
ScreenPadding=""
# Default 0, Options: from 0 to min(screen width/2,screen height/2).

Font="JetBrainsMono Nerd Font"
FontSize=""
# Default is screen height divided by 80. Options: 0-inf.

KeyboardSize="0.4"
#  Default 0.4, Options 0.1-1.0

RoundCorners="16"

Locale=""
# Locale for data and time format. I suggest leaving it blank.
HourFormat="HH:mm"
# Default Locale.ShortFormat.
DateFormat="dddd d MMMM"
# Default Locale.LongFormat.

HeaderText="Cadroc"

#################### Background ####################

BackgroundPlaceholder=""
# Must be a relative path.
# Background displayed before the actual background is loaded.
# Use only if the background is a video, otherwise leave blank.
# Connected with: Background.
Background="Backgrounds/05.png"
# Must be a relative path.
# Supports: png, jpg, jpeg, webp, gif, avi, mp4, mov, mkv, m4v, webm.
BackgroundSpeed=""
# Default 1.0. Options: 0.0-10.0 (can go higher).
# Speed of animated wallpaper.
# Connected with: Background.
PauseBackground=""
# Default false.
# If set to true, stops playback of gifs. Works only with gifs.
DimBackground="0.45"
# Options: 0.0-1.0.
# Connected with: DimBackgroundColor
CropBackground="true"
# Default false.
# Crop or fit background.
# Connected with: BackgroundHorizontalAlignment and BackgroundVerticalAlignment don't work when set to true.
BackgroundHorizontalAlignment="center"
# Default: center, Options: left, center, right.
# Horizontal position of the background picture.
# Connected with: CropBackground must be set to false.
BackgroundVerticalAlignment="center"
# Horizontal position of the background picture.
# Default: center, Options: bottom, center, top.
# Connected with: CropBackground must be set to false.

#################### Colors ####################
# Paleta Cadroc (fundo escuro quente + accent #d6c565). Contrastes medidos:
# texto/fundo do form 13.6:1, texto do botão/accent 10.2:1, muted 6.1:1 (AA).

HeaderTextColor="#ece6d4"
DateTextColor="#a39a83"
TimeTextColor="#ece6d4"

FormBackgroundColor="#1f1c16"
BackgroundColor="#1f1c16"
DimBackgroundColor="#16140f"

LoginFieldBackgroundColor="#2a261d"
PasswordFieldBackgroundColor="#2a261d"
LoginFieldTextColor="#ece6d4"
PasswordFieldTextColor="#ece6d4"
UserIconColor="#d6c565"
PasswordIconColor="#d6c565"

PlaceholderTextColor="#a39a83"
WarningColor="#e08a6a"

LoginButtonTextColor="#1b1810"
LoginButtonBackgroundColor="#d6c565"
SystemButtonsIconsColor="#ece6d4"
SessionButtonTextColor="#ece6d4"
VirtualKeyboardButtonTextColor="#ece6d4"

DropdownTextColor="#1b1810"
DropdownSelectedBackgroundColor="#e6d88c"
DropdownBackgroundColor="#d6c565"

HighlightTextColor="#1b1810"
HighlightBackgroundColor="#d6c565"
HighlightBorderColor="transparent"

HoverUserIconColor="#e6d88c"
HoverPasswordIconColor="#e6d88c"
HoverSystemButtonsIconsColor="#e6d88c"
HoverSessionButtonTextColor="#e6d88c"
HoverVirtualKeyboardButtonTextColor="#e6d88c"

#################### Form ####################

PartialBlur="true"
# Default false.
FullBlur=""
# Default false.
# If you use FullBlur I recommend setting BlurMax to 64 and Blur to 1.0.
BlurMax="32"
# Default 48, Options: 2-64 (can go higher because depends on Blur).
# Connected with: Blur.
Blur="2.0"
# Default 2.0, Options: 0.0-3.0 (without 3.0).
# Connected with: BlurMax.

HaveFormBackground="true"
# Form background is transparent if set to false.
# Connected with: PartialBlur and BackgroundColor.
FormPosition="right"
# Default: left, Options: left, center, right.

#################### Virtual Keyboard ####################

VirtualKeyboardPosition="right"
# Default: left, Options: left, center, right.

#################### Interface Behavior ####################

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

ShowKeyboardLayout="true"
# Mostra o layout de teclado atual (ex.: "Portuguese (Brazil)") acima do campo
# de usuário quando há mais de um layout configurado.

ForceLastUser="true"
# If set to true last successfully logged in user appears automatically in the username field.
PasswordFocus="true"
# Automatically focuses password field.
HideCompletePassword="true"
# Hides the password while typing.
AllowEmptyPassword="false"
# Enable login for users without a password.
AllowUppercaseLettersInUsernames="false"
# Do not change this! Uppercase letters are generally not allowed in usernames. This option is only for systems that differ from this standard!
BypassSystemButtonsChecks="false"
# Skips checking if sddm can perform shutdown, restart, suspend or hibernate, always displays all system buttons.
RightToLeftLayout="false"
# Revert the layout either because you would like the login to be on the right hand side or SDDM won't respect your language locale for some reason. This will reverse the current position of FormPosition if it is either left or right and in addition position some smaller elements on the right hand side of the form itself (also when FormPosition is set to center).

#################### Translation ####################

