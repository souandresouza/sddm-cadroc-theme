name: CI

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt install -y shellcheck

      - name: Run shellcheck
        run: shellcheck installer.sh

  qml-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt update
          sudo apt install -y qt6-declarative-dev-tools

      - name: Run qmllint
        run: |
          QMLLINT="$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          "$QMLLINT" Main.qml Components/*.qml
